name: couchspace
description: CouchSpace - watch together, miles apart.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^3.1.2
  video_player: ^2.9.2
  # pub resolves the newest version your Flutter SDK supports
  youtube_player_iframe: ">=5.2.0 <7.0.0"
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1

flutter:
  uses-material-design: true
