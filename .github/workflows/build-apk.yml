name: Build CouchSpace APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the android/ project (we only keep lib/ + pubspec.yaml in git)
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name couchspace --org com.innocentdigitals .
          rm -rf test

      # Internet permission, cleartext (http) video URLs, app name
      - name: Patch AndroidManifest
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application",
                '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application', 1)
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="CouchSpace"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: CouchSpace-apk
          path: build/app/outputs/flutter-apk/app-release.apk
